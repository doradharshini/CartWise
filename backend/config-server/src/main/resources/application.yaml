server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          # Git repo holding per-service config (see README, "Config repo"). Override with CONFIG_REPO_URI.
          uri: ${CONFIG_REPO_URI:file:../cartwise-config-repo}
          default-label: main
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health, info